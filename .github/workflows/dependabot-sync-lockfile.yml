name: Sync bun.lock on Dependabot PRs

# Dependabot's npm ecosystem only rewrites package-lock.json. Every workflow in
# this repo installs with `bun install`, which reads bun.lock — so a Dependabot
# bump lands, goes green, and never actually reaches CI, because the version CI
# installs is still the old one. That is not hypothetical: #434 and #442 both
# needed bun.lock regenerated by hand before the bump took effect.
#
# This job runs on Dependabot's own PRs, regenerates bun.lock from the updated
# package.json/package-lock.json, and pushes it onto the PR branch so the PR
# actually delivers what it claims. CI then re-runs against the synced lockfile.
#
# Why the repo carries both lockfiles at all: Dependabot supports bun for version
# updates but NOT for security updates, so package-lock.json is what keeps
# security-advisory PRs working. Renovate handles bun natively (including
# vulnerabilityAlerts) and would let the repo drop to a single lockfile — see
# CLAUDE.md.
#
# CI on the synced commit: GitHub holds every pull_request run on a commit
# pushed by GITHUB_TOKEN ("action_required") until a human approves it, so the
# commit that matters sat without CI for days (#593, #607, #608). workflow_dispatch
# is the one event GITHUB_TOKEN may trigger, so this job dispatches CI and the
# integration tests on the branch itself, then deletes the held runs so the PR
# does not show checks waiting for an approval nobody needs to give.
#
# A dispatched run is not linked to the PR, so its checks do not show there.
# Commit statuses do: this job sets "CI (dispatched)" and "Integration Tests
# (dispatched)" to pending on the synced commit, and the dispatch-status job at
# the end of each workflow replaces them with the result. Without that the PR
# would show no checks at all and a green merge button.

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write
  # Dispatch CI on the synced commit and delete the runs GitHub holds for it.
  actions: write
  # Pending statuses on the synced commit, so the PR shows CI is running.
  statuses: write

env:
  # Keep in lockstep with .github/workflows/ci.yml.
  BUN_VERSION: 1.4.2

jobs:
  sync:
    # Dependabot branches live in this repo (not a fork), so pushing to the head
    # ref is safe here. Restricting to the bot also keeps this from touching
    # human PRs, where the author should own their own lockfiles.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Regenerate bun.lock from package-lock.json
        # A plain `bun install` keeps any existing bun.lock entry that still
        # satisfies package.json, so a transitive bump (every security PR)
        # never moved (#543 landed in package-lock.json only). Without a
        # bun.lock present, bun migrates the resolutions from package-lock.json.
        run: |
          rm -f bun.lock
          bun install

      - name: Commit bun.lock if it changed
        id: commit
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches the update — nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: sync bun.lock with Dependabot update"
          git push origin HEAD:"$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run CI on the synced commit
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "$HEAD_REF"
          gh workflow run integration.yml --ref "$HEAD_REF"
          run_list="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions?query=branch%3A$HEAD_REF"
          for context in "CI (dispatched)" "Integration Tests (dispatched)"; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=pending -f context="$context" \
              -f target_url="$run_list" -f description="Running on the synced lockfile"
          done

          # The held pull_request runs appear a few seconds after the push, one
          # per workflow the synchronize event matched. Delete them as they
          # show up, and stop once two polls in a row after a deletion find
          # nothing new (no hardcoded count, so adding a workflow needs no edit
          # here). Give up quietly after 3 minutes: a leftover held run is
          # cosmetic, the statuses above are what the PR relies on.
          deleted=0
          quiet=0
          for _ in $(seq 1 18); do
            found=0
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=pull_request&status=action_required" --jq '.workflow_runs[].id'); do
              found=1
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" && deleted=$((deleted + 1))
            done
            if [ "$found" -eq 0 ] && [ "$deleted" -gt 0 ]; then
              quiet=$((quiet + 1))
              [ "$quiet" -ge 2 ] && break
            else
              quiet=0
            fi
            sleep 10
          done
          echo "Deleted $deleted held pull_request run(s) for $SHA."
