name: Dependabot auto-merge & release

# Daily unattended dependency housekeeping, driven by Claude Code.
#
# Every morning this workflow checks for open Dependabot PRs. If there are
# any, a Claude Code agent (anthropics/claude-code-action) merges the ones
# that are fully green, then bundles the merged bumps into a single patch
# release: CHANGELOG entry, version bump, push to main, and a dispatch of
# release.yml — which re-verifies the tree (typecheck/lint/knip/tests/build)
# before tagging and publishing, so a broken bump can't ship.
#
# Why the explicit `gh workflow run release.yml` at the end: the version-bump
# push is made with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do NOT
# fire other workflows' push triggers (GitHub suppresses them to prevent
# recursive runs — the same reason release.yml publishes to npm itself
# instead of handing off to publish.yml). workflow_dispatch and
# repository_dispatch are the two exceptions to that suppression, which is
# exactly what release.yml's workflow_dispatch trigger is for.
#
# Why a Claude agent instead of a plain script: the judgment calls — writing
# a real CHANGELOG entry from the merged bumps, verifying bun.lock was
# actually synced on each PR (see "Lockfiles: why there are two" in
# CLAUDE.md), and deciding to skip a PR whose checks look wrong — are the
# parts a bash script gets subtly wrong.
#
# Required secret: ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN from
# `claude setup-token` for Pro/Max subscriptions). NPM_TOKEN is already
# configured for release.yml.
#
# Safety properties:
# - The gate job costs no Claude tokens; the agent only starts when there is
#   at least one open Dependabot PR.
# - Claude only ever merges PRs authored by dependabot[bot], and only when
#   every check is green.
# - release.yml is idempotent (exits if the version's tag exists) and has its
#   own concurrency group, so a duplicate dispatch cannot double-publish.
# - npm refuses to republish an existing version — the last backstop.

on:
  schedule:
    # Daily, after the 06:00 UTC scheduled CI run so check results are fresh.
    - cron: "30 7 * * *"
  workflow_dispatch:

# Never let two housekeeping runs race each other.
concurrency:
  group: dependabot-auto-merge-release
  cancel-in-progress: false

env:
  # Keep in lockstep with .github/workflows/ci.yml and release.yml.
  BUN_VERSION: 1.3.3

jobs:
  # Cheap pre-check so the Claude agent (which costs API tokens) only runs
  # when there is actually work to do.
  gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      has_prs: ${{ steps.check.outputs.has_prs }}
    steps:
      - name: Check for open Dependabot PRs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --repo "${{ github.repository }}" \
            --author "app/dependabot" --state open --json number --jq 'length')
          echo "Open Dependabot PRs: $count"
          if [ "$count" -gt 0 ]; then
            echo "has_prs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_prs=false" >> "$GITHUB_OUTPUT"
          fi

  merge-and-release:
    needs: gate
    if: needs.gate.outputs.has_prs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # merge PRs, push the version bump to main
      pull-requests: write # merge Dependabot PRs
      checks: read # inspect PR check status
      actions: write # gh workflow run release.yml
      id-token: write # claude-code-action OIDC

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Merge green Dependabot PRs and cut a patch release
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(jq:*),Bash(node:*),Read,Edit,Write,Glob,Grep"
          prompt: |
            You are running unattended in a scheduled GitHub Actions job for
            ${{ github.repository }}. Your job: merge the open Dependabot PRs
            that are fully green, then bundle the merged bumps into one patch
            release. Read CLAUDE.md first — especially the sections
            "Lockfiles: why there are two, and the trap" and "Publishing a
            New Version".

            Step 1 — inventory:
            List open Dependabot PRs:
              gh pr list --author "app/dependabot" --state open \
                --json number,title,mergeable,headRefName

            Step 2 — merge, one PR at a time, oldest first:
            - Only ever merge PRs authored by dependabot[bot]. Never touch
              any other PR.
            - A PR qualifies only if it is mergeable (no conflicts) and every
              check is passing (`gh pr checks <n>`). Pending or failing
              checks mean skip — do not wait for or re-run checks; tomorrow's
              run will pick the PR up.
            - Lockfile guard: if the PR changes package.json or
              package-lock.json but its branch does not also contain an
              updated bun.lock (the "Sync bun.lock on Dependabot PRs"
              workflow commits it onto the branch), skip the PR and say so in
              your summary. CI installs from bun.lock, so without that sync
              the bump was never actually tested.
            - Merge with: gh pr merge <n> --squash
            - After each merge, re-check the remaining PRs: they may have
              become un-mergeable or had their checks invalidated (Dependabot
              rebases automatically, but not instantly). Skip any PR that is
              no longer clean.

            Step 3 — release (only if you merged at least one PR; otherwise
            stop here):
            - git checkout main && git pull
            - Update CHANGELOG.md (in English): add a new
              `## [X.Y.Z] - YYYY-MM-DD` section at the top listing the
              dependency bumps you merged — package, old → new version, and
              PR numbers — following the style of existing entries. If an
              `## [Unreleased]` section with content exists, fold its
              content into the same new section (this releases it, which is
              the documented flow).
            - Bump the version: npm version patch --no-git-tag-version
              (dependency bumps are always a patch release — never minor or
              major).
            - Run `bun install` so bun.lock stays in lockstep (usually a
              no-op).
            - Commit everything as "X.Y.Z" (the new version as the commit
              message) and push directly to main. Do NOT create a tag — the
              release workflow does that.
            - Trigger the release: gh workflow run release.yml --ref main
              This step is REQUIRED: your push was made with GITHUB_TOKEN,
              so it does not fire release.yml's push trigger on its own.

            Hard rules:
            - Never force-push. Never delete branches other than merged
              Dependabot PR branches.
            - Never edit workflow files — .github/workflows/publish.yml in
              particular is off-limits per CLAUDE.md.
            - Do not create a GitHub release or tag yourself; release.yml
              owns that.
            - If nothing qualifies for merging, finish WITHOUT a release and
              without pushing anything.
            - End with a short summary: what you merged, what you skipped
              and why, and whether a release was triggered.
