name: Release

# Cuts a release without anyone needing a local machine.
#
# Fires when a version change lands on main (the `1.18.3`-style commit from the
# release flow in CLAUDE.md), or on demand via workflow_dispatch. It verifies the
# tree, creates the tag and the GitHub release, and publishes to npm itself.
#
# Why it publishes directly instead of leaving that to publish.yml: a release
# created with GITHUB_TOKEN does NOT emit a `release: published` event that can
# start another workflow — GitHub suppresses those to prevent recursive runs. So
# a tag-and-release-only job here would create the release and then silently
# never publish. publish.yml is deliberately left untouched; it remains the path
# for a release a human creates with `gh release create`.
#
# Safe to re-run: tagging and publishing are decided independently. If the
# current version is already fully released (tag exists AND the version is on
# npm), the job is a no-op — so an unrelated package.json edit (a dependency
# bump) can never cut a bad release. If the tag exists but npm is missing the
# version (a publish that failed after tagging, e.g. an expired NPM_TOKEN),
# a re-run or workflow_dispatch retries just the publish.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

# Never let two releases race each other.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Keep in lockstep with .github/workflows/ci.yml and publish.yml.
  BUN_VERSION: 1.3.3

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Two independent decisions, so a publish that failed after the tag was
      # created (e.g. a dead NPM_TOKEN) can be retried with a plain
      # workflow_dispatch once the token is fixed: tag exists + version absent
      # from npm → skip tagging, still verify/build/publish. Tag exists +
      # version on npm → full no-op (an unrelated package.json edit stays a
      # non-release, same as before).
      - name: Decide what this run must do
        id: check
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — will not tag."
            echo "tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag does not exist — will tag and release."
            echo "tag=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$(npm view "claude-threads@$version" version 2>/dev/null)" = "$version" ]; then
            echo "claude-threads@$version is already on npm — will not publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "claude-threads@$version is not on npm — will publish."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.release == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Build under the engines.node floor so we catch unsafe API use that would
      # silently break users on Node 20 — same rationale as publish.yml.
      - uses: actions/setup-node@v7
        if: steps.check.outputs.release == 'true'
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: bun install
        if: steps.check.outputs.release == 'true'

      # Verify here rather than gating on the CI workflow: CI starts from the
      # same push and would be a race. These are the same checks ci.yml runs.
      - name: Type check
        if: steps.check.outputs.release == 'true'
        run: bun run typecheck

      - name: Run ESLint
        if: steps.check.outputs.release == 'true'
        run: bun run lint

      - name: Run Knip
        if: steps.check.outputs.release == 'true'
        run: bun run knip

      - name: Run tests
        if: steps.check.outputs.release == 'true'
        run: bun test src/ --timeout 15000

      - run: bun run build
        if: steps.check.outputs.release == 'true'

      - name: Verify dist files exist
        if: steps.check.outputs.release == 'true'
        run: |
          test -f dist/index.js
          test -f dist/mcp/mcp-server.js
          test -f dist/statusline/writer.js

      # Creates the tag on this commit and the release in one call.
      - name: Create tag and GitHub release
        if: steps.check.outputs.release == 'true' && steps.check.outputs.tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --generate-notes
          # Append a sponsor footer below the auto-generated notes. gh has no
          # flag to combine --generate-notes with extra body text in the right
          # order, so fetch the generated body and edit the release once.
          body="$(gh release view "$tag" --json body --jq .body)"
          printf '%s\n\n---\n\n💛 *Enjoying claude-threads? Consider [sponsoring the project](https://github.com/sponsors/axolotl-systems).*\n' "$body" > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Publish to npm
        if: steps.check.outputs.release == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
